<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ luyện B1 Preliminary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16243F;
  --ink-soft:#4A5771;
  --paper:#FFFFFF;
  --page:#E7EAF1;
  --rule:#C9D0DE;
  --marker:#FFD84D;
  --marker-dim:#FFF0B8;
  --red:#C8102E;
  --green:#0C7C63;
  --radius:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.dsp{font-family:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 120px}

/* ---- header ---- */
header{padding:34px 0 18px}
h1{font-size:clamp(28px,7vw,44px);margin:0 0 6px}
.mark{position:relative;display:inline;background:linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 94%, transparent 94%);padding:0 .12em}
.sub{color:var(--ink-soft);font-size:14.5px;margin:0}
.counter{margin-top:14px;display:flex;gap:16px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:10px;flex-wrap:wrap}
.counter b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;color:var(--ink)}

/* ---- nav ---- */
nav{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--rule);margin-bottom:22px}
.navin{max-width:720px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;border-bottom:3px solid transparent;
  font:inherit;font-weight:600;font-size:14.5px;color:var(--ink-soft);
  padding:13px 10px;cursor:pointer;white-space:nowrap;
}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}

/* ---- generic blocks ---- */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.lede{font-size:15px;color:var(--ink-soft);margin:0 0 18px}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);margin:30px 0 10px;font-family:"Be Vietnam Pro",sans-serif}
h2.sec:first-child{margin-top:0}
.en{font-weight:600}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.93em}

/* golden rules */
.rule-n{float:left;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;line-height:.8;margin:2px 12px 0 0;color:var(--marker);-webkit-text-stroke:1.5px var(--ink)}
.rule h3{font-size:19px;margin:0 0 6px}
.rule p{margin:0 0 8px;font-size:15px}
.rule .ex{clear:both;font-size:14px;background:var(--marker-dim);padding:9px 11px;border-radius:var(--radius);margin:0}

/* tips accordion */
details.tip{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:8px}
details.tip>summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
details.tip>summary::-webkit-details-marker{display:none}
details.tip>summary span{font-size:12.5px;color:var(--ink-soft);font-weight:500}
details.tip[open]>summary{border-bottom:1px solid var(--rule)}
details.tip ul{margin:0;padding:14px 16px 16px 32px}
details.tip li{margin-bottom:8px;font-size:15px}
details.tip li:last-child{margin-bottom:0}

/* deck picker */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:22px}
.deck{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 13px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.deck:hover,.deck:focus-visible{border-color:var(--ink);outline:none}
.deck[aria-pressed="true"]{background:var(--marker);border-color:var(--ink)}
.deck b{display:block;font-size:14.5px;font-weight:600}
.deck small{color:var(--ink-soft);font-size:12px}
.deck[aria-pressed="true"] small{color:var(--ink)}

/* study surface */
.stage{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:24px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:center}
.prompt{font-size:19px;font-weight:600;margin:0}
.answer{margin-top:16px;padding-top:16px;border-top:1px dashed var(--rule)}
.answer .big{font-size:19px;font-weight:600}
.answer .note{font-size:14.5px;color:var(--ink-soft);margin-top:6px}
.meta{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;display:flex;justify-content:space-between;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.btn{
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  border-radius:var(--radius);padding:11px 16px;flex:1 1 auto;
}
button.btn.ghost{background:var(--paper);color:var(--ink)}
button.btn.yes{background:var(--green);border-color:var(--green)}
button.btn.no{background:var(--red);border-color:var(--red)}
button.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.btn:disabled{opacity:.45;cursor:default}

/* options */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{
  text-align:left;font:inherit;font-size:15px;cursor:pointer;
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);
  padding:12px 14px;color:inherit;display:flex;gap:10px;align-items:flex-start;
}
.opt:hover{border-color:var(--ink)}
.opt.correct{border-color:var(--green);background:#E6F4F0;box-shadow:inset 3px 0 0 var(--green)}
.opt.wrong{border-color:var(--red);background:#FBEAEC;box-shadow:inset 3px 0 0 var(--red)}
.opt:disabled{cursor:default}
.tag{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--ink-soft);min-width:1.1em}

/* verdict */
.verdict{margin-top:14px;font-size:15px;padding:12px 14px;border-radius:var(--radius)}
.verdict.ok{background:#E6F4F0;color:var(--green);font-weight:600}
.verdict.bad{background:#FBEAEC;color:var(--red)}
.verdict b{color:var(--ink)}

/* typing */
textarea,input[type=text]{
  width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--rule);
  border-radius:var(--radius);background:var(--paper);color:var(--ink);resize:vertical;
}
textarea:focus,input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:14px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--rule);background:var(--paper)}
.chip.ok{background:#E6F4F0;border-color:var(--green);color:var(--green);font-weight:600}
.chip.bad{background:#FBEAEC;border-color:var(--red);color:var(--red);text-decoration:line-through}
.chip .fix{color:var(--ink);text-decoration:none;font-weight:600;margin-left:6px}

/* lists / reference */
.pair{border-bottom:1px solid var(--rule);padding:11px 0;display:grid;grid-template-columns:1fr;gap:3px}
.pair:last-child{border-bottom:0}
.pair .vi{font-size:14.5px;color:var(--ink-soft)}
.pair .en{font-size:15.5px}
@media(min-width:620px){.pair{grid-template-columns:1fr 1fr;gap:16px;align-items:baseline}}
.trap{display:flex;gap:10px;font-size:15px;padding:7px 0;align-items:flex-start}
.trap .x{color:var(--red);font-weight:700}
.trap .v{color:var(--green);font-weight:700}
.chain{display:grid;gap:0;margin-top:8px}
.chain div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14.5px}
.chain div span:first-child{color:var(--ink-soft);font-size:13px}
.chain em{font-style:normal;background:var(--marker-dim);padding:0 3px}
pre.sample{white-space:pre-wrap;font-family:"Be Vietnam Pro",sans-serif;font-size:15px;margin:0;line-height:1.7}
.hint{font-size:13.5px;color:var(--ink-soft);margin-top:10px}
.empty{text-align:center;padding:34px 10px}
.empty p{font-size:17px;font-weight:600;margin:0 0 14px}
.srch{margin-bottom:16px}
.hits{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
mark{background:var(--marker);color:inherit;padding:0 2px}
.bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden;margin:12px 0 0}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<nav>
  <div class="navin" role="tablist" id="nav"></div>
</nav>

<div class="wrap">
  <header id="hdr">
    <h1>Sổ luyện <span class="mark">B1 Preliminary</span></h1>
    <p class="sub">Toàn bộ mẹo, bẫy và đáp án của 11 đề, gộp lại để luyện tay nhanh.</p>
    <div class="counter">
      <span>Hôm nay <b id="cToday">0</b> câu</span>
      <span>Đúng <b id="cAcc">—</b></span>
      <span>Chuỗi đúng <b id="cStreak">0</b></span>
    </div>
  </header>
  <main id="app"></main>
</div>

w2: [
  {t:"1. Xin lỗi George vì không đi xem phim tối thứ Sáu", body:"Hi George,\nI am really sorry because I can’t go to the cinema with you on Friday evening. The reason is I will be working on that day. I hope that we can meet and go to the cinema with each other on another day.\nThank you and sorry,\nHue"},
  {t:"2. Rủ Jenna đến quán cà phê mới mở", body:"Hi Jenna,\nI went to an amazing new cafe in town last weekend. They serve delicious pizzas and pasta. The best thing is the desserts – the chocolate cake is delicious! Are you free on Friday? We could go there together if you like.\nHue"},

w3: [
  {t:"1. Khuyên bạn hòa giải sau buổi tiệc gia đình", body:"Hi,\nI’m sorry to hear that your family party didn’t go well. Luckily, I get on quite well with my family. We sometimes argue, but we always try to talk calmly and understand each other. I think you should say sorry to your dad if you were rude, even if it wasn’t completely your fault. You could also spend some time playing or talking with your little sister instead of getting angry. Good communication and patience can really help. I hope everything will be better soon.\nBest wishes,\nTung"},
  {t:"2. Truyện mở đầu: “It was the happiest day of my life.”", body:"It was the happiest day of my life. My school organized a talent show, and I decided to sing in front of everyone. At first, I was very nervous because it was my first performance. However, when the music started, I felt much more confident. My classmates clapped and cheered loudly. In the end, I won first prize and received a beautiful certificate. My parents were very proud of me and took me out for dinner to celebrate. I will never forget that wonderful day because it taught me to believe in myself."},
  {t:"3. Email giới thiệu người bạn thân nhất", body:"Hi,\nThanks for your email. I have three close friends, but we are studying at different universities now. We still keep in touch by texting and calling each other. My best friend is Minh. He is 21 years old and studies Information Technology. He comes from Hanoi and enjoys playing football, listening to music, and reading books. We often study together, play sports, and go out for coffee at weekends. Minh is very important to me because he always listens to my problems and encourages me when I feel sad. If I don’t meet him for a long time, I really miss him.\nBest wishes,\nTung"},
  {t:"4. Khuyên bạn làm lành với mẹ và em gái", body:"Hi,\nI’m sorry to hear that your sister’s birthday party didn’t go well. Luckily, I get on well with my family. We sometimes have arguments, but we always talk and solve our problems. I think you should say sorry to your sister and your mother if you were rude. You should also listen to their feelings and spend more time with them. Being kind and patient can help improve your relationship. I’m sure everything will be better if you talk honestly and show that you care about them.\nBest wishes,\nTung"},
  {t:"5. Truyện mở đầu: “I saw the advert for a talent show and decided to apply.”", body:"I saw the advert for a talent show and decided to apply. I loved singing, but I was very nervous because I had never performed on a stage before. I practised every evening after school with my friends. On the day of the competition, I took a deep breath and sang my favourite song. The audience clapped loudly, and the judges smiled at me. In the end, I won second prize. I was very happy and proud of myself. That experience taught me to be confident and never give up on my dreams."},
  {t:"6. Bản ngắn gọn: giải quyết mâu thuẫn gia đình", body:"Hi ...,\nI’m sorry to hear about your birthday party. I usually get on well with my family, but sometimes we argue too. I think you should talk calmly with your sister and tell her how you feel. You can also say sorry if you made a mistake. Spending more time together and helping each other at home may improve your relationship. As for your mother, try to listen to her and understand her feelings. Good communication is very important in a family. I hope everything will be better soon.\nBest wishes,\nHuyen"}
],

  S.today++; if(good){S.ok++; S.streak++; if(S.streak>S.best)S.best=S.streak;} else S.streak=0;
  paintCounter(); save();
}
function paintCounter(){
  cToday.textContent=S.today;
  cAcc.textContent = S.today? Math.round(S.ok/S.today*100)+'%' : '—';
  cStreak.textContent=S.streak;
}

/* ---------- helpers ---------- */
const el=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLowerCase().normalize('NFC').replace(/[’']/g,"'").replace(/[.,;:!?£$]/g,'').replace(/\s+/g,' ').trim();
const splitWords=s=>s.split(',').map(x=>x.trim()).filter(Boolean);

VIEWS.quiz = ()=>{

function drawQuiz(stage){
  stage.innerHTML='';
  const items=DECKS[qzKey].items;
  if(!qzQ){
    const right=pick(items);
    const others=shuffle(items.filter(i=>i.a!==right.a)).slice(0,3);
    qzQ={item:right, opts:shuffle([right,...others])};
    qzDone=false;
  }
  const box=el('div','stage');
  box.append(el('p','meta','<span>'+esc(DECKS[qzKey].name)+'</span>'));
  box.append(el('p','prompt',esc(qzQ.item.q)));
  const opts=el('div','opts');

    const b=el('button','opt');
    b.innerHTML='<span class="tag">'+'ABCD'[i]+'</span><span>'+esc(o.a)+'</span>';
    b.onclick=()=>{
      if(qzDone) return; qzDone=true;
      const good = o.a===qzQ.item.a; score(good);
      [...opts.children].forEach((c,j)=>{
        c.disabled=true;
        if(qzQ.opts[j].a===qzQ.item.a) c.classList.add('correct');
        else if(j===i) c.classList.add('wrong');
      });
      const v=el('div','verdict '+(good?'ok':'bad'), good? 'Chuẩn.' : 'Đáp án đúng: <b>'+esc(qzQ.item.a)+'</b>');
      box.insertBefore(v, box.lastChild);
      box.lastChild.querySelector('button').textContent='Câu tiếp';
      box.lastChild.querySelector('button').disabled=false;
    };
    opts.append(b);
  });
  box.append(opts);
  const row=el('div','row');
  const nx=el('button','btn ghost','Bỏ qua câu này');
  nx.onclick=()=>{qzQ=null;drawQuiz(stage);};
  row.append(nx); box.append(row);
  stage.append(box);
}

VIEWS.fill = ()=>{

function drawFill(stage){
  stage.innerHTML='';
  const item=FILLS[fiIdx];
  const box=el('div','stage');
  box.append(el('p','meta','<span>'+esc(item.grp)+'</span><span>'+(fiIdx+1)+'/'+FILLS.length+'</span>'));
  box.append(el('p','prompt',esc(item.t)));

  const ta=el('textarea'); ta.rows=3; ta.placeholder='từ 1, từ 2, từ 3...';
  box.append(ta);
  const out=el('div');
  box.append(out);
  const row=el('div','row');
  const chk=el('button','btn','Chấm bài');
  chk.onclick=()=>{
    if(fiChecked) return;
    fiChecked=true;
    const given=splitWords(ta.value);
    const chips=el('div','chips');
    let right=0;
    item.w.forEach((w,i)=>{
      const g=given[i]||'';
      const ok = norm(g)===norm(w);
      if(ok) right++;
      const c=el('span','chip '+(ok?'ok':'bad'));
      c.textContent = g || '(trống)';
      if(!ok) c.append(el('span','fix','→ '+w));
      chips.append(c);
    });
    out.append(chips);
    const pct=Math.round(right/item.w.length*100);
    out.append(el('div','verdict '+(pct>=80?'ok':'bad'), 'Đúng <b>'+right+'/'+item.w.length+'</b> từ.'));
    score(pct>=80);
    ta.disabled=true; chk.disabled=true;
  };
  const rev=el('button','btn ghost','Xem đáp án');
  rev.onclick=()=>{ out.innerHTML=''; out.append(el('div','verdict ok', item.w.join(', '))); };
  const nx=el('button','btn ghost','Bài sau');
  nx.onclick=()=>{ fiIdx=(fiIdx+1)%FILLS.length; fiChecked=false; drawFill(stage); };
  row.append(chk,rev,nx); box.append(row);
  const bar=el('div','bar','<i style="width:'+((fiIdx+1)/FILLS.length*100)+'%"></i>');
  box.append(bar);
  stage.append(box);
  ta.focus();
}

VIEWS.ref = ()=>{
  const f=document.createDocumentFragment();
  f.append(el('p','lede','Tra nhanh mọi thứ. Gõ từ khoá tiếng Việt hoặc tiếng Anh.'));

  f.append(inp);
  const res=el('div');
  f.append(res);
  const INDEX=buildIndex();
  const run=()=>{
    const q=norm(inp.value);
    res.innerHTML='';
    if(q.length<2){ res.append(refAll()); return; }
    const hits=INDEX.filter(x=>norm(x.text).includes(q)).slice(0,60);
    res.append(el('p','hits',hits.length?('Tìm thấy '+hits.length+' mục'):'Không có mục nào khớp. Thử từ khoá ngắn hơn.'));
    hits.forEach(h=>{
      const c=el('div','card');
      c.append(el('p','meta','<span>'+esc(h.src)+'</span>'));
      c.append(el('div',null,hl(h.text,inp.value)));
      res.append(c);
    });
  };
  inp.addEventListener('input',run);
  run();
  return f;
};
function hl(text,q){
  const t=esc(text); if(!q.trim())return t;
  try{
    const rx=new RegExp('('+q.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return t.replace(rx,'<mark>$1</mark>');
  }catch(e){ return t; }
}
function buildIndex(){
  const ix=[];
  DATA.r1.forEach(([a,b])=>ix.push({src:'Reading P1',text:a+'  →  '+b}));
  DATA.r2.forEach(g=>g.rows.forEach(([a,b])=>ix.push({src:'Reading P2 · '+g.topic,text:a+'  →  '+b})));
  DATA.r3.forEach(t=>{
    t.b.forEach(s=>ix.push({src:'Reading P3 · '+t.t+' · BẪY (B)',text:s}));
    t.a.forEach(s=>ix.push({src:'Reading P3 · '+t.t+' · ĐÚNG (A)',text:s}));
  });
  DATA.r4.forEach(t=>ix.push({src:'Reading P4 · '+t.t,text:t.chain.map(c=>c[0]+': '+c[1]+' ('+c[2]+')').join(' → ')}));
  DATA.r5.forEach(([t,w])=>ix.push({src:'Reading P5 · '+t,text:w}));
  DATA.w1.forEach(([a,b])=>ix.push({src:'Writing P1',text:a+'  →  '+b}));
  DATA.w1b.forEach(([a,b])=>ix.push({src:'Writing P1 · barem '+a,text:b}));
  DATA.l1.forEach(([q,a,d])=>ix.push({src:'Listening P1',text:q+'  →  '+a+' — '+d}));
  DATA.l2.forEach(([a,b])=>ix.push({src:'Listening P2 · '+a,text:b}));
  DATA.l3.forEach(([t,w])=>ix.push({src:'Listening P3 · '+t,text:w}));
  DATA.l4.forEach(t=>ix.push({src:'Listening P4 · '+t.t,text:t.rows.map((r,i)=>(i+1)+'. '+r[1]+' ('+r[0]+')').join(' │ ')}));
  return ix;
}

    if(it.text) c.append(el('pre','sample',esc(it.text)));
    if(it.s1) c.append(el('p',null,esc(it.s1)));
    if(it.stem) c.append(el('p','prompt',esc(it.stem)));
    if(e.type==='gap'){
      const wrap=el('p',null,esc(it.pre)+' ');
      const inp=el('input'); inp.type='text'; inp.style.width='auto'; inp.style.minWidth='150px';
      inp.placeholder='tối đa 3 từ';
      inp.oninput=()=>exAns[i]=inp.value;
      if(exGraded){ inp.disabled=true; inp.value=exAns[i]||''; }
      wrap.append(inp, ' '+it.post);
      c.append(wrap);
      if(exGraded){
        const ok=it.ans.some(a=>norm(a)===norm(exAns[i]||''));
        c.append(el('div','verdict '+(ok?'ok':'bad'), ok?'Đúng.':'Đáp án: <b>'+esc(it.ans[0])+'</b>'));
      }
    }else{
      const opts=el('div','opts');
      it.opts.forEach((o,j)=>{
        const b=el('button','opt');
        b.innerHTML='<span class="tag">'+'ABCD'[j]+'</span><span>'+esc(o)+'</span>';
        if(exAns[i]===j) b.style.borderColor='var(--ink)', b.style.background='var(--marker-dim)';
        if(exGraded){
          b.disabled=true;
          if(j===it.ans) b.className='opt correct';
          else if(exAns[i]===j) b.className='opt wrong';
        } else b.onclick=()=>{exAns[i]=j;render();};
        opts.append(b);
      });
      c.append(opts);
      if(exGraded && it.why) c.append(el('div','verdict '+(exAns[i]===it.ans?'ok':'bad'), esc(it.why)));
    }
    f.append(c);
  });
  const row=el('div','row');
  if(!exGraded){
    const done=Object.keys(exAns).length;
    const sub=el('button','btn','Nộp bài ('+done+'/'+e.items.length+' đã làm)');
    sub.onclick=()=>{
      exGraded=true;
      let right=0;
      e.items.forEach((it,i)=>{
        const ok = e.type==='gap' ? it.ans.some(a=>norm(a)===norm(exAns[i]||'')) : exAns[i]===it.ans;
        if(ok) right++; score(ok);
      });
      exResult=right;
      render(); window.scrollTo({top:0});
    };
    row.append(sub);
  }else{
    const again=el('button','btn','Làm lại đề này');
    again.onclick=()=>{exAns={};exGraded=false;render();window.scrollTo({top:0});};
    const other=el('button','btn ghost','Đề khác');
    other.onclick=()=>{exOpen=null;render();};
    row.append(again,other);
  }
  f.append(row);
  if(exGraded){
    const pct=Math.round(exResult/e.items.length*100);
    const v=el('div','verdict '+(pct>=70?'ok':'bad'),'Kết quả: <b>'+exResult+'/'+e.items.length+'</b> ('+pct+'%)');
    f.insertBefore(v, f.children[1]);
  }
  return f;
};
let exResult=0;

/* ---------- router ---------- */
const TABS=[
  ['tips','Mẹo'],['exam','Làm đề'],['cards','Thẻ lật'],['quiz','Trắc nghiệm'],
  ['traps','Bẫy A/B'],['fill','Gõ dãy từ'],['write','Viết'],['ref','Tra cứu']
];
let cur='tips';
function render(){
  nav.innerHTML='';
  TABS.forEach(([k,label])=>{
    const b=el('button',null,label);
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', k===cur);
    b.onclick=()=>{cur=k;render();window.scrollTo({top:0,behavior:'instant'});};
    nav.append(b);
  });
  const app=document.getElementById('app');
  app.innerHTML='';
  app.append(VIEWS[cur]());
}
load();
render();
</script>
