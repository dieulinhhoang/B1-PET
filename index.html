<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ luyện B1 Preliminary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16243F; --ink-soft:#4A5771; --paper:#FFFFFF; --page:#E7EAF1; --rule:#C9D0DE;
  --marker:#FFD84D; --marker-dim:#FFF0B8; --red:#C8102E; --green:#0C7C63; --radius:3px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9EDF6; --ink-soft:#A3AEC6; --paper:#1B2436; --page:#121926; --rule:#33405B;
    --marker:#C9A227; --marker-dim:#3A3520; --red:#FF7A8A; --green:#4ED3B0;
  }
}
:root[data-theme="dark"]{
  --ink:#E9EDF6; --ink-soft:#A3AEC6; --paper:#1B2436; --page:#121926; --rule:#33405B;
  --marker:#C9A227; --marker-dim:#3A3520; --red:#FF7A8A; --green:#4ED3B0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 110px}
header{padding:28px 0 14px}
h1{font-size:clamp(26px,6.5vw,40px);margin:0 0 6px}
.mark{background:linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 94%, transparent 94%);padding:0 .12em}
.sub{color:var(--ink-soft);font-size:14.5px;margin:0}
.counter{margin-top:14px;display:flex;gap:18px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:10px;flex-wrap:wrap}
.counter b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;color:var(--ink)}
nav{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--rule);margin-bottom:20px}
.navin{max-width:720px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:600;font-size:15px;color:var(--ink-soft);padding:13px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.lede{font-size:15px;color:var(--ink-soft);margin:0 0 16px}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);margin:28px 0 10px;font-family:"Be Vietnam Pro",sans-serif}
h2.sec:first-child{margin-top:0}
.rule-n{float:left;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;line-height:.8;margin:2px 12px 0 0;color:var(--marker);-webkit-text-stroke:1.5px var(--ink)}
.rule h3{font-size:19px;margin:0 0 6px}
.rule p{margin:0 0 8px;font-size:15px}
.rule .ex{clear:both;font-size:14px;background:var(--marker-dim);padding:9px 11px;border-radius:var(--radius);margin:0}
details.tip{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:8px}
details.tip>summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
details.tip>summary::-webkit-details-marker{display:none}
details.tip>summary span{font-size:12.5px;color:var(--ink-soft);font-weight:500}
details.tip[open]>summary{border-bottom:1px solid var(--rule)}
details.tip ul{margin:0;padding:14px 16px 16px 32px}
details.tip li{margin-bottom:8px;font-size:15px}
details.tip li:last-child{margin-bottom:0}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:18px}
.deck{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 13px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.deck:hover{border-color:var(--ink)}
.deck[aria-pressed="true"]{background:var(--marker);border-color:var(--ink);color:#16243F}
.deck b{display:block;font-size:14.5px;font-weight:600}
.deck small{color:var(--ink-soft);font-size:12px}
.deck[aria-pressed="true"] small{color:#16243F}
.deck .bar{margin-top:8px}
.bar{height:5px;background:var(--rule);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .25s ease}
.stage{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:22px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.prompt{font-size:19px;font-weight:600;margin:0}
.answer{margin-top:16px;padding-top:16px;border-top:1px dashed var(--rule)}
.answer .big{font-size:19px;font-weight:600;margin:0}
.answer .note{font-size:14.5px;color:var(--ink-soft);margin:8px 0 0}
.meta{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;display:flex;justify-content:space-between;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.btn{font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:var(--radius);padding:11px 16px;flex:1 1 auto}
button.btn.ghost{background:var(--paper);color:var(--ink)}
button.btn.yes{background:var(--green);border-color:var(--green);color:#fff}
button.btn.no{background:var(--red);border-color:var(--red);color:#fff}
button.btn:disabled{opacity:.45;cursor:default}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{text-align:left;font:inherit;font-size:15px;cursor:pointer;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;color:inherit;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--ink)}
.opt.correct{border-color:var(--green);background:var(--marker-dim);box-shadow:inset 3px 0 0 var(--green)}
.opt.wrong{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.opt.chosen{border-color:var(--ink);background:var(--marker-dim)}
.opt:disabled{cursor:default}
.tag{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--ink-soft);min-width:1.1em}
.verdict{margin-top:14px;font-size:15px;padding:12px 14px;border-radius:var(--radius);background:var(--marker-dim)}
.verdict.ok{color:var(--green);font-weight:600}
.verdict.bad{color:var(--red)}
.verdict b{color:var(--ink)}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:14px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--rule);background:var(--paper)}
.chip.ok{border-color:var(--green);color:var(--green);font-weight:600}
.chip.bad{border-color:var(--red);color:var(--red);text-decoration:line-through}
.chip .fix{color:var(--ink);text-decoration:none;font-weight:600;margin-left:6px}
.pair{border-bottom:1px solid var(--rule);padding:11px 0;display:grid;grid-template-columns:1fr;gap:3px}
.pair:last-child{border-bottom:0}
.pair .vi{font-size:14.5px;color:var(--ink-soft)}
.pair .en{font-size:15.5px;font-weight:600}
@media(min-width:620px){.pair{grid-template-columns:1fr 1fr;gap:16px;align-items:baseline}}
.chain{display:grid;margin-top:8px}
.chain div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14.5px}
.chain div span:first-child{color:var(--ink-soft);font-size:13px}
.chain em{font-style:normal;background:var(--marker-dim);padding:0 3px}
pre.sample{white-space:pre-wrap;font-family:"Be Vietnam Pro",sans-serif;font-size:15px;margin:0;line-height:1.7;overflow-x:auto}
.hint{font-size:13.5px;color:var(--ink-soft);margin-top:10px}
.srch{margin-bottom:14px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:inherit;cursor:pointer;font-size:15px;flex:none;line-height:1;vertical-align:middle}
.spk:hover{background:var(--marker-dim)}
.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;padding:9px 6px;background:var(--paper);color:var(--ink-soft);border:0;border-right:1px solid var(--rule);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.muted{color:var(--ink-soft);font-size:14.5px;text-align:center;padding:18px 0}
.kwcard{padding:0;overflow:hidden}
.kwif{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;background:var(--marker-dim)}
.kwif .badge,.kwthen .badge{flex:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:12px;letter-spacing:.03em;border-radius:99px;padding:2px 9px;margin-top:2px}
.kwif .badge{color:#16243F;background:var(--marker);border:1.5px solid var(--ink)}
.kwthen{display:flex;gap:10px;align-items:flex-start;padding:13px 16px}
.kwthen .badge{color:#fff;background:var(--green)}
.kwarrow{display:flex;align-items:center;font-size:13px;color:var(--ink-soft);padding:4px 16px}
.kwarrow::before,.kwarrow::after{content:"";flex:1;border-top:1px dashed var(--rule)}
.kwarrow span{padding:0 8px;white-space:nowrap}
.kwex{font-size:14px;color:var(--ink-soft);margin:0;padding:0 16px 8px}
.kwans{font-size:14.5px;margin:0;padding:0 16px 14px}
.kwans b{color:var(--green)}
.hits{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
mark{background:var(--marker);color:#16243F;padding:0 2px}
.trap{display:flex;gap:10px;font-size:15px;padding:7px 0;align-items:flex-start}
.trap .x{color:var(--red);font-weight:700}
.trap .v{color:var(--green);font-weight:700}
.sleeprow{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
.sleeprow label{display:block;color:var(--ink-soft);margin-bottom:4px}
.sleeprow select{font:inherit;font-size:15px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.sleepstage{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:26px 18px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.sleepstage .sleepvi{font-size:15px;opacity:.7;margin:0}
.sleepstage .sleepen{font-size:20px;font-weight:600;margin:0}
.sleepstage .row{justify-content:center}
.sleepchk{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:9px}
.sleepchk input{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav><div class="navin" role="tablist" id="nav"></div></nav>
<div class="wrap">
  <header>
    <h1>Sổ luyện <span class="mark">B1 Preliminary</span></h1>
    <p class="sub">Đáp án 11 đề, gộp lại một chỗ. Không còn lặp.</p>
    <div class="counter">
      <span>Hôm nay <b id="cToday">0</b> câu</span>
      <span>Đúng <b id="cAcc">—</b></span>
      <span>Chuỗi <b id="cStreak">0</b></span>
      <span>Đã thuộc <b id="cMast">0</b></span>
    </div>
  </header>
  <main id="app"></main>
</div>
<script>
/* ============================================================
   MỘT NGUỒN DỮ LIỆU DUY NHẤT.
   Mọi tab đều đọc từ đây, không tab nào chép lại của tab nào.
   ============================================================ */
const DATA = {
golden:[
 {t:"Đáp án đúng = câu diễn đạt lại",d:"Không chọn phương án lặp y hệt từ trong đề. Đề luôn dùng từ đồng nghĩa hoặc câu đồng nghĩa.",ex:"Text: “Don’t forget we’re going to the cinema” → Đáp án: to remind him about an arrangement"},
 {t:"Thứ tự câu hỏi = thứ tự bài",d:"Câu 1 ở đoạn đầu, câu cuối ở đoạn kết. Đúng tuyệt đối với Reading Part 3, Part 4 và Listening Part 2, Part 4.",ex:"Đang mắc câu 3 mà đã đọc tới đoạn cuối → chắc chắn bỏ sót, quay lại giữa bài."},
 {t:"Một chi tiết sai = cả câu SAI",d:"Cảnh giác từ tuyệt đối hoá: only, never, all, every, must, always, unless, except. Lệch một mốc thời gian hoặc một chủ thể là thành B ngay.",ex:"Bài nói “most students” mà đáp án ghi “all students” → SAI."}
],
tips:[
 {sk:"Reading",p:"Part 1",items:["Đọc từng mẩu text ngắn và tự hỏi: mình sẽ thấy nó ở đâu, lúc nào?","Đừng cho rằng một phương án đúng chỉ vì nó chứa đúng những từ có trong text.","Đáp án đúng cùng nghĩa với text nhưng thường dùng từ khác."]},
 {sk:"Reading",p:"Part 2",items:["Đọc nhanh mô tả 5 người và gạch chân thông tin quan trọng nhất.","Cùng một thông tin thường được viết bằng từ/cụm khác giữa phần mô tả và đoạn văn.","Đoạn bạn chọn phải khớp TẤT CẢ yêu cầu của người đó, không phải chỉ một ý."]},
 {sk:"Reading",p:"Part 3",items:["Đọc lướt toàn bài trước khi trả lời câu hỏi.","Thông tin trong bài theo đúng thứ tự câu hỏi.","Gạch chân đúng cụm trong bài chứng minh đáp án của bạn."]},
 {sk:"Reading",p:"Part 4",items:["Người viết có thể kể chuyện của chính mình hoặc của người/vật khác.","Câu hỏi hỏi cảm xúc và quan điểm của NGƯỜI VIẾT, không phải của bạn.","Câu đầu và câu cuối thường phải gom thông tin từ nhiều chỗ trong bài."]},
 {sk:"Reading",p:"Part 5",items:["Đọc hết cả bài trước.","Nhìn kỹ từ đứng ngay trước và ngay sau chỗ trống.","Thử lần lượt A, B, C, D vào chỗ trống. Không chắc thì chọn cái nghe xuôi tai nhất."]},
 {sk:"Writing",p:"Part 1",items:["Chuyển câu trực tiếp sang gián tiếp thì phải đổi cả đại từ lẫn thì của động từ.","Câu thứ hai phải giữ nguyên nghĩa câu thứ nhất.","Không viết quá ba từ."]},
 {sk:"Writing",p:"Part 2",items:["Nối các câu ngắn bằng từ liên kết: so, because, as, despite...","Phải đủ cả ba ý đề cho. Gạch chân ba ý đó trong đề trước khi viết.","Mở đúng cách (Hi John, / Dear Chris,), kết đúng cách (Best wishes, / All the best,) và đừng quên ký tên."]},
 {sk:"Writing",p:"Part 3",items:["Viết thư: đủ mọi thông tin đề yêu cầu.","Viết truyện: bắt buộc mở đầu bằng đúng câu đề cho và phải có kết thúc rõ ràng.","Dùng đa dạng thì và cấu trúc."]},
 {sk:"Listening",p:"Part 1",items:["Đọc câu hỏi thật kỹ, gạch chân từ quan trọng nhất.","Người nói sẽ nhắc tới cả ba bức tranh, nhưng chỉ một tranh đúng.","Lượt nghe 1 chọn đáp án, lượt nghe 2 kiểm tra lại."]},
 {sk:"Listening",p:"Part 2",items:["Trước khi nghe, đọc kỹ câu hỏi và các lựa chọn.","Câu hỏi theo đúng thứ tự bài nghe.","Nghe kỹ họ đang nói quá khứ, hiện tại hay tương lai."]},
 {sk:"Listening",p:"Part 3",items:["Bạn sẽ nghe nhiều từ/số hợp với chỗ trống, nhưng chỉ một cái đúng.","Thường mỗi chỗ trống chỉ điền một đến hai từ.","Chỉ cần viết đúng từ nghe được, không cần biến đổi."]},
 {sk:"Listening",p:"Part 4",items:["Thường có một giọng nữ và một giọng nam để bạn phân biệt ai đang nói.","Mỗi câu thường hỏi ý kiến của MỘT người. Nghe đúng người đó.","Đôi khi câu hỏi hỏi ý kiến CẢ HAI. Nghe hết cả hai rồi mới chọn."]},
 {sk:"Speaking",p:"Part 1",items:["Giám khảo sẽ bảo bạn đánh vần họ của mình. Tập trước cho chắc.","Phase 2 đừng trả lời một từ: cho ví dụ hoặc lý do.","Không nghe rõ thì xin giám khảo nhắc lại, đừng đoán."]},
 {sk:"Speaking",p:"Part 2",items:["Thể hiện quan tâm tới điều bạn cùng thi nói và phản hồi lại.","Nhìn và nói với bạn cùng thi, không phải với giám khảo.","Cuối phần phải cùng nhau chốt một quyết định chung."]},
 {sk:"Speaking",p:"Part 3 & 4",items:["Part 3: tả ai, ở đâu, đang làm gì. Thêm quần áo họ mặc và đồ vật thấy được.","Học cách tả vị trí: on the left, on the right, above, below...","Không biết từ nào thì bỏ qua, tập trung vào thứ mình biết.","Part 4: giám khảo chỉ nêu chủ đề rồi im. Hai thí sinh tự hỏi đáp với nhau.","Hỏi lại bạn cùng thi và tỏ ra hứng thú với câu trả lời.","Đừng sợ sai, cứ nói tiếp."]}
],
w1kw:[
 {kw:"enough",rule:"tính từ/trạng từ + enough + (for sb) + to V",ex:"Tom is very young. He can't drive.",ans:"Tom isn't old enough to drive."},
 {kw:"too",rule:"too + tính từ/trạng từ + (for sb) + to V",ex:"The coffee was very hot. She couldn't drink it.",ans:"The coffee was too hot for her to drink."},
 {kw:"so...that",rule:"so + tính từ/trạng từ + that + mệnh đề",ex:"The film was very boring. We left early.",ans:"The film was so boring that we left early."},
 {kw:"such...that",rule:"such + (a/an) + tính từ + danh từ + that + mệnh đề",ex:"It was a very boring film. We left early.",ans:"It was such a boring film that we left early."},
 {kw:"comparative (-er/more)",rule:"tính từ ngắn + -er + than / more + tính từ dài + than",ex:"Her house costs more than my house.",ans:"Her house is more expensive than mine."},
 {kw:"as...as",rule:"as + tính từ/trạng từ + as (so sánh ngang bằng)",ex:"John is 20. Mary is 20 too.",ans:"John is as old as Mary."},
 {kw:"not as...as",rule:"not as + tính từ + as (kém hơn)",ex:"My car is not very fast. Your car is faster.",ans:"My car isn't as fast as yours."},
 {kw:"used to",rule:"used to + V (thói quen trong QUÁ KHỨ, nay không còn)",ex:"I lived in Hanoi when I was young, but I don't now.",ans:"I used to live in Hanoi."},
 {kw:"be/get used to",rule:"be/get used to + Ving (đã quen với việc gì)",ex:"She has lived in London for years so it's normal for her now.",ans:"She is used to living in London."},
 {kw:"would rather",rule:"would rather + V (nguyên mẫu không to) + than + V",ex:"I prefer staying at home to going out tonight.",ans:"I would rather stay at home than go out tonight."},
 {kw:"prefer",rule:"prefer + Ving/N + to + Ving/N",ex:"I like tea more than coffee.",ans:"I prefer tea to coffee."},
 {kw:"had better",rule:"had better + V (nguyên mẫu) — lời khuyên nên làm ngay",ex:"I think it's a good idea for you to leave now.",ans:"You had better leave now."},
 {kw:"must / have to",rule:"must/have to + V — bắt buộc, cần thiết",ex:"It is necessary for you to wear a helmet.",ans:"You must wear a helmet."},
 {kw:"don't have to / needn't",rule:"don't have to / needn't + V — KHÔNG bắt buộc (không phải là cấm)",ex:"It isn't necessary for you to come.",ans:"You don't have to come."},
 {kw:"mustn't",rule:"mustn't + V — bị CẤM, không được phép",ex:"It is forbidden to smoke here.",ans:"You mustn't smoke here."},
 {kw:"since",rule:"have/has + V3 + since + mốc thời gian (điểm bắt đầu)",ex:"She moved here in 2018 and she still lives here.",ans:"She has lived here since 2018."},
 {kw:"for",rule:"have/has + V3 + for + khoảng thời gian",ex:"She moved here 5 years ago and still lives here.",ans:"She has lived here for 5 years."},
 {kw:"ago",rule:"quá khứ đơn + khoảng thời gian + ago",ex:"It is now 2024. She started this job in 2020.",ans:"She started this job 4 years ago."},
 {kw:"although / though",rule:"Although/Though + mệnh đề (đủ S+V), không dùng với danh từ",ex:"It was raining. We still went out.",ans:"Although it was raining, we still went out."},
 {kw:"despite / in spite of",rule:"Despite/In spite of + Ving/danh từ (KHÔNG dùng mệnh đề)",ex:"It was raining. We still went out.",ans:"Despite the rain, we still went out."},
 {kw:"because",rule:"because + mệnh đề (có S+V)",ex:"We stayed at home. The weather was bad.",ans:"We stayed at home because the weather was bad."},
 {kw:"because of",rule:"because of + Ving/danh từ",ex:"We stayed at home. The weather was bad.",ans:"We stayed at home because of the bad weather."},
 {kw:"unless",rule:"unless = if...not — điều kiện phủ định",ex:"If you don't hurry, you will miss the bus.",ans:"Unless you hurry, you will miss the bus."},
 {kw:"wish + quá khứ đơn",rule:"wish + S + V-ed/were — ước ở hiện tại",ex:"I don't have a car.",ans:"I wish I had a car."},
 {kw:"wish + had + V3",rule:"wish + S + had + V3 — tiếc nuối chuyện đã qua",ex:"I didn't study hard.",ans:"I wish I had studied harder."},
 {kw:"wish + would",rule:"wish + S + would + V — mong ai đó đổi hành động (phàn nàn)",ex:"I want you to stop making noise.",ans:"I wish you would stop making noise."},
 {kw:"passive voice (be + V3)",rule:"O + be + V3 + (by S)",ex:"They built this house in 1990.",ans:"This house was built in 1990."},
 {kw:"reported speech (say/tell)",rule:"Lùi thì 1 bậc, đổi đại từ và trạng từ thời gian-nơi chốn",ex:"“I am tired,” she said.",ans:"She said (that) she was tired."},
 {kw:"tell sb to V / not to V",rule:"tell/ask + O + (not) + to V — tường thuật câu mệnh lệnh",ex:"“Close the door,” he said to me.",ans:"He told me to close the door."},
 {kw:"ask if/whether",rule:"ask/wonder + if/whether + mệnh đề — tường thuật câu hỏi Yes/No",ex:"“Are you coming?” she asked.",ans:"She asked if I was coming."},
 {kw:"gerund sau enjoy/finish/stop",rule:"enjoy/finish/give up/stop/mind + Ving",ex:"She likes to swim very much.",ans:"She enjoys swimming."},
 {kw:"to-infinitive sau want/decide/hope",rule:"want/decide/plan/hope/promise + to V",ex:"He wants that he can travel abroad.",ans:"He wants to travel abroad."},
 {kw:"it takes + time + to V",rule:"It takes (sb) + khoảng thời gian + to V",ex:"I need 20 minutes to get to school.",ans:"It takes me 20 minutes to get to school."},
 {kw:"spend + time + Ving",rule:"spend + thời gian/tiền + (on) + Ving",ex:"He plays football for 2 hours every day.",ans:"He spends 2 hours playing football every day."},
 {kw:"not only...but also",rule:"not only + A + but also + B",ex:"She is clever and she is also kind.",ans:"She is not only clever but also kind."},
 {kw:"neither...nor",rule:"neither + A + nor + B",ex:"He doesn't like tea and he doesn't like coffee.",ans:"He likes neither tea nor coffee."},
 {kw:"the first time",rule:"It's the first time + S + have/has + V3",ex:"I have never been to Paris before now.",ans:"This is the first time I have been to Paris."},
 {kw:"superlative (the most/-est)",rule:"the + tính từ ngắn + -est / the most + tính từ dài",ex:"No other student in the class is as tall as Tom.",ans:"Tom is the tallest student in the class."},
 {kw:"as soon as",rule:"as soon as + mệnh đề — ngay khi",ex:"I will call you the moment I arrive.",ans:"I will call you as soon as I arrive."},
 {kw:"if (điều kiện 1/2)",rule:"If + hiện tại đơn, will + V (loại 1) / If + quá khứ đơn, would + V (loại 2)",ex:"Study hard or you will fail.",ans:"If you don't study hard, you will fail."}
],
tenses:[
 {name:"Present Simple — Hiện tại đơn",form:"S + V(s/es) | don't/doesn't + V | Do/Does + S + V?",usage:"Thói quen, sự thật hiển nhiên, lịch trình cố định",signal:"always, usually, often, sometimes, never, every day, on Mondays",ex:"She works in a bank. The train leaves at 9am."},
 {name:"Present Continuous — Hiện tại tiếp diễn",form:"S + am/is/are + V-ing",usage:"Đang xảy ra lúc nói; kế hoạch đã sắp xếp trong tương lai gần",signal:"now, at the moment, look!, listen!, tonight, tomorrow (đã có kế hoạch)",ex:"She is studying right now. I am meeting him tomorrow at 6pm."},
 {name:"Present Perfect — Hiện tại hoàn thành",form:"S + have/has + V3",usage:"Xảy ra trong quá khứ, không rõ thời điểm, còn liên quan hiện tại; kinh nghiệm",signal:"already, just, yet, ever, never, since, for, so far, recently",ex:"I have already finished my homework. Have you ever been to Japan?"},
 {name:"Present Perfect Continuous",form:"S + have/has + been + V-ing",usage:"Nhấn mạnh QUÁ TRÌNH kéo dài từ quá khứ đến hiện tại",signal:"since, for, how long, all day, lately",ex:"I have been waiting for you for two hours."},
 {name:"Past Simple — Quá khứ đơn",form:"S + V2/-ed | didn't + V | Did + S + V?",usage:"Đã xảy ra và kết thúc hẳn, biết rõ thời điểm",signal:"yesterday, last night, ago, in 2010, when I was young",ex:"She visited her grandma last weekend."},
 {name:"Past Continuous — Quá khứ tiếp diễn",form:"S + was/were + V-ing",usage:"Đang xảy ra tại một thời điểm quá khứ, hoặc bị hành động khác xen vào",signal:"at 8pm yesterday, while, when, at that time",ex:"I was cooking dinner when the phone rang."},
 {name:"Past Perfect — Quá khứ hoàn thành",form:"S + had + V3",usage:"Xảy ra TRƯỚC một hành động khác trong quá khứ",signal:"before, after, by the time, already, just",ex:"The train had left before we arrived at the station."},
 {name:"Future Simple (will)",form:"S + will + V | won't + V",usage:"Quyết định tức thời; dự đoán không căn cứ; lời hứa",signal:"tomorrow, next week, in the future, I think/hope/promise, probably",ex:"I think it will rain tomorrow. I'll help you."},
 {name:"Near Future (be going to)",form:"S + am/is/are + going to + V",usage:"Dự định có kế hoạch trước; dự đoán có dấu hiệu rõ ràng",signal:"look at those clouds..., plan to, intend to",ex:"Look at those clouds! It's going to rain."},
 {name:"Future Continuous",form:"S + will be + V-ing",usage:"Đang diễn ra tại một thời điểm xác định trong tương lai",signal:"at this time tomorrow, at 8pm next Friday",ex:"This time tomorrow, I will be flying to London."}
],

w2:[
 {t:"Xin lỗi George vì không đi xem phim tối thứ Sáu",body:"Hi George,\nI am really sorry because I can’t go to the cinema with you on Friday evening. The reason is I will be working on that day. I hope that we can meet and go to the cinema with each other on another day.\nThank you and sorry,\nHue"},
 {t:"Rủ Jenna đến quán cà phê mới mở",body:"Hi Jenna,\nI went to an amazing new cafe in town last weekend. They serve delicious pizzas and pasta. The best thing is the desserts – the chocolate cake is delicious! Are you free on Friday? We could go there together if you like.\nHue"},
 {t:"Vừa đi nghỉ về, khoe ảnh với Tom",body:"Hi Tom,\nI’ve just got back from my holiday in Nha Trang. It was amazing! The beaches were beautiful, and I loved the food. The people were friendly, too. Would you like to see my photos? I can email them to you if you want.\nVan"},
 {t:"Mới mua đèn ngủ, viết cho Teresa",body:"Dear Teresa,\nI’m pleased to tell you that I have got a new lamp. It is quite nice and small. I need its light as I often get up at midnight. I am going to put it beside my bed. Come and see it.\nLove,\nVan"},
 {t:"Nghỉ xuân ở Đà Nẵng về, viết cho Vân Anh",body:"Hi Van Anh,\nI’ve just come back from my Spring holiday in Da Nang. I really enjoyed the beautiful beaches, delicious seafood, and friendly people. I took lots of nice photos. Would you like to come to my house this weekend? I’ll show you all my holiday pictures.\nBest,\nTung"},
 {t:"Rủ Linh tham gia câu lạc bộ tiếng Anh",body:"Hi Linh,\nI went to a new English club last weekend. It was fun because we played games, spoke English, and made new friends. I enjoyed the speaking activities most. Would you like to go there with me next Saturday? I think you’ll love it!\nTung"}
],
w3:[
 {t:"Khuyên bạn hòa giải sau buổi tiệc gia đình",body:"Hi,\nI’m sorry to hear that your family party didn’t go well. Luckily, I get on quite well with my family. We sometimes argue, but we always try to talk calmly and understand each other. I think you should say sorry to your dad if you were rude, even if it wasn’t completely your fault. You could also spend some time playing or talking with your little sister instead of getting angry. Good communication and patience can really help. I hope everything will be better soon.\nBest wishes,\nTung"},
 {t:"Truyện mở đầu: “It was the happiest day of my life.”",body:"It was the happiest day of my life. My school organized a talent show, and I decided to sing in front of everyone. At first, I was very nervous because it was my first performance. However, when the music started, I felt much more confident. My classmates clapped and cheered loudly. In the end, I won first prize and received a beautiful certificate. My parents were very proud of me and took me out for dinner to celebrate. I will never forget that wonderful day because it taught me to believe in myself."},
 {t:"Email giới thiệu người bạn thân nhất",body:"Hi,\nThanks for your email. I have three close friends, but we are studying at different universities now. We still keep in touch by texting and calling each other. My best friend is Minh. He is 21 years old and studies Information Technology. He comes from Hanoi and enjoys playing football, listening to music, and reading books. We often study together, play sports, and go out for coffee at weekends. Minh is very important to me because he always listens to my problems and encourages me when I feel sad. If I don’t meet him for a long time, I really miss him.\nBest wishes,\nTung"},
 {t:"Khuyên bạn làm lành với mẹ và em gái",body:"Hi,\nI’m sorry to hear that your sister’s birthday party didn’t go well. Luckily, I get on well with my family. We sometimes have arguments, but we always talk and solve our problems. I think you should say sorry to your sister and your mother if you were rude. You should also listen to their feelings and spend more time with them. Being kind and patient can help improve your relationship. I’m sure everything will be better if you talk honestly and show that you care about them.\nBest wishes,\nTung"},
 {t:"Truyện mở đầu: “I saw the advert for a talent show and decided to apply.”",body:"I saw the advert for a talent show and decided to apply. I loved singing, but I was very nervous because I had never performed on a stage before. I practised every evening after school with my friends. On the day of the competition, I took a deep breath and sang my favourite song. The audience clapped loudly, and the judges smiled at me. In the end, I won second prize. I was very happy and proud of myself. That experience taught me to be confident and never give up on my dreams."}
],

function uniqPairs(arr){const seen=new Set();return arr.filter(p=>{const k=p.a.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});}

/* ---------- state ---------- */
const S={today:0,ok:0,streak:0,mast:{}};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
(function(){const r=lsGet("b1_state");if(r){try{Object.assign(S,JSON.parse(r))}catch(e){}}})();
function save(){lsSet("b1_state",JSON.stringify(S));}
function mastCount(){return Object.values(S.mast).filter(v=>v>=2).length;}
function paint(){
 cToday.textContent=S.today;
 cAcc.textContent=S.today?Math.round(S.ok/S.today*100)+"%":"—";
 cStreak.textContent=S.streak;
 cMast.textContent=mastCount();
}
function record(id,good){
 S.today++;
 if(good){S.ok++;S.streak++;S.mast[id]=(S.mast[id]||0)+1;}
 else{S.streak=0;S.mast[id]=0;}
 paint();save();
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.,;:!?£$]/g,"").replace(/\s+/g," ").trim();
const enOnly=s=>{const m=String(s).match(/^(.*?)\s*\([^)]*\)\s*$/);return m?m[1]:s;};
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en/.test(v.lang)&&/Google|Natural|Neural|Premium/i.test(v.name))||vs.find(v=>/en-US/.test(v.lang))||vs.find(v=>/^en/.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(enOnly(t));u.lang="en-US";u.rate=.92;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}}
function spk(get){const b=el("button","spk","🔊");b.type="button";b.setAttribute("aria-label","Nghe");b.onclick=e=>{e.stopPropagation();speak(typeof get==="function"?get():get);};return b;}

let tipTab="rule",kwQ="";
V.tips=()=>{
 const f=document.createDocumentFragment();

 [["rule","Nguyên tắc"],["part","Mẹo từng phần"],["kw","Từ khoá viết"],["tense","Các thì"]].forEach(([k,l])=>{
  const b=el("button",null,l);b.setAttribute("aria-pressed",k===tipTab);b.onclick=()=>{tipTab=k;render();};seg.append(b);});
 f.append(seg);
 if(tipTab==="rule"){
  DATA.golden.forEach((g,i)=>{const c=el("div","card rule");c.append(el("span","rule-n",String(i+1)),el("h3",null,esc(g.t)),el("p",null,esc(g.d)),el("p","ex",esc(g.ex)));f.append(c);});
 }
 if(tipTab==="part"){
  DATA.tips.forEach(t=>{const d=el("details","tip");d.append(el("summary",null,esc(t.sk)+' <span>'+esc(t.p)+'</span>'));const ul=el("ul");t.items.forEach(i=>ul.append(el("li",null,esc(i))));d.append(ul);f.append(d);});
 }
 if(tipTab==="kw"||tipTab==="tense"){
  const box=el("input");box.type="text";box.className="srch";box.value=kwQ;
  box.placeholder=tipTab==="kw"?"Lọc từ khoá: enough, wish, since...":"Lọc dấu hiệu: yesterday, since, going to...";
  const list=el("div");
  box.oninput=()=>{kwQ=box.value;fill();};
  f.append(box,list);
  function fill(){
   list.innerHTML="";const q=norm(kwQ);
   if(tipTab==="kw"){
    const items=DATA.w1kw.filter(x=>!q||norm(x.kw+" "+x.rule).includes(q));
    if(!items.length){list.append(el("p","muted","Không có mục nào khớp."));return;}
    items.forEach(x=>{
     const c=el("div","card kwcard");
     c.append(el("div","kwif",'<span class="badge">NẾU đề cho</span> <b>'+esc(x.kw)+'</b>'));
     c.append(el("div","kwarrow","<span>dùng ngay</span>"));
     c.append(el("div","kwthen",'<span class="badge">THÌ viết</span> <b>'+esc(x.rule)+'</b>'));
     c.append(el("p","kwex","Đề: "+esc(x.ex)));
     const p=el("p","kwans","Viết lại: <b>"+esc(x.ans)+"</b> ");p.append(spk(x.ans));c.append(p);
     list.append(c);});
   }else{
    const items=DATA.tenses.filter(x=>!q||norm(x.name+" "+x.signal+" "+x.usage).includes(q));
    if(!items.length){list.append(el("p","muted","Không có thì nào khớp."));return;}
    items.forEach(x=>{
     const c=el("div","card kwcard");
     c.append(el("div","kwif",'<span class="badge">NẾU thấy</span> <b>'+esc(x.signal)+'</b>'));
     c.append(el("div","kwarrow","<span>→ dùng</span>"));
     c.append(el("div","kwthen",'<span class="badge">THÌ chia</span> <b>'+esc(x.name)+'</b>'));
     c.append(el("p","kwex","Công thức: "+esc(x.form)));
     c.append(el("p","kwex","Dùng khi: "+esc(x.usage)));
     const p=el("p","kwans","Ví dụ: "+esc(x.ex)+" ");p.append(spk(x.ex));c.append(p);

/* --- LUYỆN: một máy luyện, tự đổi dạng theo bộ dữ liệu --- */
let drDeck="mix",drQ=null,drDone=false,drFlip=false,drMode="quiz";
function deckPool(){
 if(drDeck==="mix")return Object.values(DECKS).flatMap(d=>d.items.map((it,i)=>({d,it,id:d.key+":"+i})));
 const d=DECKS[drDeck];return d.items.map((it,i)=>({d,it,id:d.key+":"+i}));
}
function nextItem(){
 const pool=deckPool();
 const weak=pool.filter(p=>(S.mast[p.id]||0)<2);
 return pick(weak.length?weak:pool);
}
V.drill=()=>{
 const f=document.createDocumentFragment();
 f.append(el("p","lede","Chọn phần muốn luyện. App tự chọn dạng bài hợp với phần đó, và tự cho hiện lại câu bạn chưa thuộc."));
 const g=el("div","decks");
 const mk=(k,name,note,prog)=>{
  const b=el("button","deck");b.setAttribute("aria-pressed",drDeck===k);
  b.innerHTML="<b>"+esc(name)+"</b><small>"+esc(note)+"</small>";
  if(prog!=null)b.append(el("div","bar",'<i style="width:'+prog+'%"></i>'));
  b.onclick=()=>{drDeck=k;drQ=null;render();};return b;};
 const all=Object.values(DECKS).reduce((n,d)=>n+d.items.length,0);
 g.append(mk("mix","Trộn tất cả",all+" câu",Math.round(mastCount()/all*100)));
 Object.values(DECKS).forEach(d=>{
  const m=d.items.filter((_,i)=>(S.mast[d.key+":"+i]||0)>=2).length;
  g.append(mk(d.key,d.name,m+"/"+d.items.length+" thuộc",Math.round(m/d.items.length*100)));});
 f.append(g);
 const stage=el("div");f.append(stage);drawDrill(stage);
 return f;
};
function drawDrill(stage){
 stage.innerHTML="";
 if(!drQ){drQ=nextItem();drDone=false;drFlip=false;}
 const {d,it,id}=drQ;
 const box=el("div","stage");
 const m=S.mast[id]||0;
 box.append(el("p","meta",'<span>'+esc(d.name)+(it.src?" · "+esc(it.src):"")+'</span><span>'+(m>=2?"đã thuộc":m===1?"gần thuộc":"câu mới")+'</span>'));
 const next=()=>{drQ=null;drawDrill(stage);};

 if(d.kind==="pair"){
  const seg=el("div","seg");
  [["quiz","Trắc nghiệm"],["card","Thẻ lật"]].forEach(([k,l])=>{const b=el("button",null,l);b.setAttribute("aria-pressed",drMode===k);b.onclick=()=>{drMode=k;drDone=false;drFlip=false;drawDrill(stage);};seg.append(b);});
  box.append(seg);
  const p=el("p","prompt");p.append(document.createTextNode(it.q+" "));box.append(p);
  if(drMode==="card"){
   if(drFlip){const a=el("div","answer");const ap=el("p","big");ap.append(document.createTextNode(it.a+" "),spk(it.a));a.append(ap);box.append(a);}
   const row=el("div","row");
   if(!drFlip){const b=el("button","btn","Xem đáp án");b.onclick=()=>{drFlip=true;drawDrill(stage);};row.append(b);}
   else{
    const y=el("button","btn yes","Thuộc rồi");y.onclick=()=>{record(id,true);next();};
    const n=el("button","btn no","Chưa thuộc");n.onclick=()=>{record(id,false);next();};
    row.append(y,n);}
   box.append(row);
  }else{
   const others=shuffle(d.items.filter(x=>x.a&&x.a!==it.a)).slice(0,3);
   const opts=shuffle([it,...others]);
   const wrap=el("div","opts");
   opts.forEach((o,i)=>{
    const b=el("button","opt",'<span class="tag">'+"ABCD"[i]+'</span><span>'+esc(o.a)+"</span>");
    b.onclick=()=>{
     if(drDone)return;drDone=true;
     const good=o.a===it.a;record(id,good);
     [...wrap.children].forEach((c,j)=>{c.disabled=true;if(opts[j].a===it.a)c.classList.add("correct");else if(j===i)c.classList.add("wrong");});
     const v=el("div","verdict "+(good?"ok":"bad"),good?"Chuẩn.":"Đáp án đúng: <b>"+esc(it.a)+"</b>");
     v.append(" ",spk(it.a));box.append(v);
     const r=el("div","row");const nb=el("button","btn","Câu tiếp");nb.onclick=next;r.append(nb);box.append(r);
    };
    wrap.append(b);});
   box.append(wrap);
   const r=el("div","row");const sk=el("button","btn ghost","Bỏ qua");sk.onclick=next;r.append(sk);box.append(r);
  }
 }

 if(d.kind==="ab"){
  box.append(el("p","prompt",esc(it.q)));
  const row=el("div","row");
  const A=el("button","btn yes","A — Đúng với bài"),B=el("button","btn no","B — Sai / bẫy");
  [[A,"A"],[B,"B"]].forEach(([btn,v])=>{btn.onclick=()=>{
   if(drDone)return;drDone=true;const good=v===it.ans;record(id,good);
   A.disabled=B.disabled=true;
   box.append(el("div","verdict "+(good?"ok":"bad"),good?"Chuẩn. Đáp án "+it.ans+".":"Đáp án đúng là <b>"+it.ans+"</b>."));
   const r=el("div","row");const nb=el("button","btn","Câu tiếp");nb.onclick=next;r.append(nb);box.append(r);};});
  row.append(A,B);box.append(row);
 }

 if(d.kind==="list"){
  box.append(el("p","prompt",esc(it.q)));
  box.append(el("p","hint",it.words.length+" từ, gõ theo thứ tự, cách nhau bằng dấu phẩy."));
  const ta=el("textarea");ta.rows=3;ta.placeholder="từ 1, từ 2, từ 3...";box.append(ta);
  const out=el("div");box.append(out);
  const row=el("div","row");
  const chk=el("button","btn","Chấm");
  chk.onclick=()=>{
   if(drDone)return;drDone=true;
   const given=ta.value.split(",").map(s=>s.trim());
   const chips=el("div","chips");let right=0;
   it.words.forEach((w,i)=>{const gv=given[i]||"";const ok=norm(gv)===norm(w);if(ok)right++;
    const c=el("span","chip "+(ok?"ok":"bad"));c.textContent=gv||"(trống)";if(!ok)c.append(el("span","fix","→ "+w));chips.append(c);});
   out.append(chips);
   const good=right/it.words.length>=.8;
   out.append(el("div","verdict "+(good?"ok":"bad"),"Đúng <b>"+right+"/"+it.words.length+"</b> từ."));
   record(id,good);ta.disabled=true;chk.disabled=true;
   const r=el("div","row");const nb=el("button","btn","Bài tiếp");nb.onclick=next;r.append(nb);box.append(r);};
  const rev=el("button","btn ghost","Xem đáp án");rev.onclick=()=>{out.innerHTML="";out.append(el("div","verdict ok",it.words.join(", ")));};
  row.append(chk,rev);box.append(row);
 }

 if(d.kind==="type"){
  box.append(el("p","prompt",esc(it.q)));
  box.append(el("p","hint",esc(it.hint)));
  const inp=el("input");inp.type="text";inp.placeholder="Viết lại câu...";box.append(inp);
  const row=el("div","row");
  const chk=el("button","btn","Kiểm tra");
  chk.onclick=()=>{
   if(drDone)return;drDone=true;
   const good=norm(inp.value)===norm(it.a);record(id,good);inp.disabled=true;chk.disabled=true;
   const v=el("div","verdict "+(good?"ok":"bad"),good?"Chuẩn từng chữ.":"Đáp án: <b>"+esc(it.a)+"</b>");
   v.append(" ",spk(it.a));box.append(v);
   const r=el("div","row");const nb=el("button","btn","Câu tiếp");nb.onclick=next;r.append(nb);box.append(r);};
  const sk=el("button","btn ghost","Bỏ qua");sk.onclick=next;
  row.append(chk,sk);box.append(row);
 }
 stage.append(box);
}

let exOpen=null,exAns={},exGraded=false,exRight=0;
V.exam=()=>{
 const f=document.createDocumentFragment();
 if(!exOpen){
  f.append(el("p","lede","Đề thật trích từ Cambridge Exam Booster. Nộp bài là chấm ngay kèm giải thích từng câu."));
  let last="";
  EXAMS.forEach(e=>{
   if(e.part!==last){f.append(el("h2","sec",esc(e.part)));last=e.part;}
   const b=el("button","deck");b.style.width="100%";b.style.marginBottom="8px";
   b.innerHTML="<b>"+esc(e.title)+"</b><small>"+e.items.length+" câu</small>";
   b.onclick=()=>{exOpen=e;exAns={};exGraded=false;render();scrollTo(0,0);};
   f.append(b);});
  return f;
 }
 const e=exOpen;
 const back=el("button","btn ghost","← Chọn đề khác");back.onclick=()=>{exOpen=null;render();};
 const top=el("div","row");top.style.marginTop="0";top.append(back);f.append(top);
 if(exGraded){const pct=Math.round(exRight/e.items.length*100);
  f.append(el("div","verdict "+(pct>=70?"ok":"bad"),"Kết quả: <b>"+exRight+"/"+e.items.length+"</b> ("+pct+"%)"));}
 f.append(el("h2","sec",esc(e.part)+" · "+esc(e.title)));
 f.append(el("p","lede",esc(e.instr)));
 if(e.passage){const p=el("div","card");p.append(el("div","sample",esc(e.passage).replace(/\((\d+)\)/g,"<b>($1)</b> _______")));f.append(p);}
 e.items.forEach((it,i)=>{
  const c=el("div","card");
  c.append(el("p","meta","<span>Câu "+(i+1)+"</span>"));
  if(it.text)c.append(el("pre","sample",esc(it.text)));
  if(it.s1)c.append(el("p",null,esc(it.s1)));
  if(it.stem)c.append(el("p","prompt",esc(it.stem)));
  if(e.type==="gap"){
   const w=el("p",null,esc(it.pre)+" ");
   const inp=el("input");inp.type="text";inp.style.width="auto";inp.style.minWidth="150px";inp.placeholder="tối đa 3 từ";
   inp.value=exAns[i]||"";inp.oninput=()=>exAns[i]=inp.value;if(exGraded)inp.disabled=true;
   w.append(inp," "+it.post);c.append(w);
   if(exGraded){const ok=it.ans.some(a=>norm(a)===norm(exAns[i]||""));
    c.append(el("div","verdict "+(ok?"ok":"bad"),ok?"Đúng.":"Đáp án: <b>"+esc(it.ans[0])+"</b>"));}
  }else{
   const opts=el("div","opts");
   it.opts.forEach((o,j)=>{
    const b=el("button","opt",'<span class="tag">'+"ABCD"[j]+'</span><span>'+esc(o)+"</span>");
    if(exAns[i]===j)b.classList.add("chosen");
    if(exGraded){b.disabled=true;b.className="opt";if(j===it.ans)b.classList.add("correct");else if(exAns[i]===j)b.classList.add("wrong");}
    else b.onclick=()=>{exAns[i]=j;render();};
    opts.append(b);});
   c.append(opts);
   if(exGraded&&it.why)c.append(el("div","verdict "+(exAns[i]===it.ans?"ok":"bad"),esc(it.why)));
  }
  f.append(c);});
 const row=el("div","row");
 if(!exGraded){
  const sub=el("button","btn","Nộp bài ("+Object.keys(exAns).length+"/"+e.items.length+")");
  sub.onclick=()=>{exGraded=true;exRight=0;
   e.items.forEach((it,i)=>{const ok=e.type==="gap"?it.ans.some(a=>norm(a)===norm(exAns[i]||"")):exAns[i]===it.ans;if(ok)exRight++;record("ex:"+e.id+":"+i,ok);});
   render();scrollTo(0,0);};
  row.append(sub);
 }else{
  const again=el("button","btn","Làm lại");again.onclick=()=>{exAns={};exGraded=false;render();scrollTo(0,0);};
  const other=el("button","btn ghost","Đề khác");other.onclick=()=>{exOpen=null;render();};
  row.append(again,other);
 }
 f.append(row);
 return f;
};

V.ref=()=>{

 [["find","Tra cứu"],["sleep","Nghe trước khi ngủ"]].forEach(([k,l])=>{
  const b=el("button",null,l);b.setAttribute("aria-pressed",(k==="sleep")===refSleep);
  b.onclick=()=>{refSleep=(k==="sleep");if(!refSleep)slStop();render();};seg.append(b);});

 if(!refSleep){

  const inp=el("input");inp.type="text";inp.className="srch";inp.value=refQ;
  inp.placeholder="ví dụ: ngân hàng, borrow, golf, Iditarod...";
  const res=el("div");
  const run=()=>{
   const q=norm(inp.value);res.innerHTML="";
   const hits=(q.length<2?INDEX:INDEX.filter(x=>norm(x.src+" "+x.text).includes(q))).slice(0,80);
   res.append(el("p","hits",q.length<2?"Đang hiện 80 mục đầu — gõ để lọc.":"Tìm thấy "+hits.length+" mục"));
   hits.forEach(h=>{const c=el("div","card");

    if(h.en)d.append(" ",spk(h.en));

  };
  inp.oninput=()=>{refQ=inp.value;run();};
  f.append(inp,res);run();
  return f;
 }

 f.append(el("p","lede","Chọn nội dung, bấm Phát rồi để máy một bên. App chỉ đọc câu tiếng Anh, phần tiếng Việt hiện trên màn hình."));
 const srcs={r1:"Thông báo (Reading P1)",r3:"Câu đúng bài đọc (Reading P3)",w1:"Cấu trúc viết lại (Writing P1)",tn:"Ví dụ các thì"};
 const chk={};
 Object.entries(srcs).forEach(([k,l])=>{
  const lab=el("label","sleepchk");const cb=el("input");cb.type="checkbox";cb.checked=(k==="r1"||k==="w1");chk[k]=cb;
  lab.append(cb,document.createTextNode(" "+l));f.append(lab);});
 const row=el("div","sleeprow");
 const rl=el("label",null,"Tốc độ");const rs=el("select");
 [[".7","Chậm"],[".85","Vừa"],["1","Bình thường"]].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;if(+v===slRate)o.selected=true;rs.append(o);});
 rs.onchange=()=>slRate=+rs.value;
 const tl=el("label",null,"Hẹn giờ tắt");const ts=el("select");
 [[10,"10 phút"],[20,"20 phút"],[30,"30 phút"],[45,"45 phút"],[0,"Không giới hạn"]].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;if(v===slMins)o.selected=true;ts.append(o);});
 ts.onchange=()=>slMins=+ts.value;
 row.append(rl,rs,tl,ts);f.append(row);
 const stage=el("div","sleepstage");f.append(stage);
 function build(){
  let out=[];
  if(chk.r1.checked)DATA.r1.forEach(([vi,en])=>out.push({vi,en}));
  if(chk.r3.checked)DATA.r3.forEach(x=>x.a.forEach(s=>{const m=s.match(/^(.*?)\s*\(([^)]*)\)\s*$/);out.push({en:m?m[1]:s,vi:m?m[2]:""});}));
  if(chk.w1.checked)DATA.w1kw.forEach(x=>out.push({vi:x.kw+" — "+x.rule,en:x.ans}));
  if(chk.tn.checked)DATA.tenses.forEach(x=>out.push({vi:x.name,en:x.ex}));
  return out.filter(x=>x.en);
 }
 function paintSl(item,msg){
  stage.innerHTML="";
  if(item){if(item.vi)stage.append(el("p","sleepvi",esc(item.vi)));stage.append(el("p","sleepen",esc(item.en)));}
  stage.append(el("p","hint",msg||(slPlaying?"Đang phát…":"Sẵn sàng.")));
  const r=el("div","row");
  if(!slPlaying){const p=el("button","btn yes","▶ Phát");p.onclick=start;r.append(p);}
  else{const s=el("button","btn no","■ Dừng");s.onclick=()=>{slStop();paintSl(null,"Đã dừng.");};r.append(s);}
  stage.append(r);
 }
 function start(){
  const list=build();
  if(!list.length){alert("Chọn ít nhất 1 nội dung.");return;}
  slQueue=shuffle(list);slIdx=0;slPlaying=true;
  if(slMins>0)slTimer=setTimeout(()=>{slStop();paintSl(null,"Đã hết giờ.");},slMins*60000);
  play();
 }
 function play(){
  if(!slPlaying)return;
  if(slIdx>=slQueue.length){slIdx=0;slQueue=shuffle(slQueue);}
  const it=slQueue[slIdx++];paintSl(it);
  try{const u=new SpeechSynthesisUtterance(it.en);u.lang="en-US";u.rate=slRate;if(voice)u.voice=voice;
   u.onend=u.onerror=()=>{if(slPlaying)setTimeout(play,900);};speechSynthesis.speak(u);}catch(e){}
 }
 paintSl(null);
 return f;
};
function hl(text,q){const t=esc(text);if(!q||!q.trim())return t;
 try{const rx=new RegExp("("+q.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return t.replace(rx,"<mark>$1</mark>");}catch(e){return t;}}

const TABS=[["tips","Mẹo"],["drill","Luyện"],["exam","Làm đề"],["write","Viết"],["ref","Tra cứu"]];
let cur="tips";
function render(){
 const nav=document.getElementById("nav");nav.innerHTML="";
 TABS.forEach(([k,l])=>{const b=el("button",null,l);b.setAttribute("role","tab");b.setAttribute("aria-selected",k===cur);
  b.onclick=()=>{if(k!=="ref")slStop();cur=k;render();scrollTo(0,0);};nav.append(b);});
 const app=document.getElementById("app");app.innerHTML="";app.append(V[cur]());
}
paint();render();
